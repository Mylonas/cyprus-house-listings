name: Update Cyprus house listings

on:
  schedule:
    # Every 6 hours. Real-estate inventory doesn't move hourly like fuel
    # prices, so this is deliberately less aggressive than deals-blog's
    # hourly crons — tune via cron string if you want it more/less frequent.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

# The refresh commit is pushed back to master with GITHUB_TOKEN, which is
# read-only by default.
# Two runs of this workflow must not overlap: they scrape for ~35 minutes and
# then both push. Queue instead of racing.
concurrency:
  group: update-listings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # A hung scraper should fail fast, not burn the 6-hour Actions limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Scrape all house sources and rebuild page
        run: npm run scrape

      - name: Scrape plot/land sources and rebuild plots page
        run: npm run scrape:plots
        continue-on-error: true

      # A bare `git push` with no retry cost this workflow a full 34-minute scrape
      # on 2026-07-26: a scheduled run and a dispatched run finished a minute
      # apart and the second was rejected as non-fast-forward. commit-data.sh
      # re-reads the remote and replays the regenerated files on top.
      - name: Commit and push if listings changed
        id: commit
        run: |
          bash scripts/ci/commit-data.sh "chore: refresh listings data [skip ci]"             src/data/listings.json             public/index.html             src/data/plots.json             public/plots.html

      # Pushes made with GITHUB_TOKEN don't trigger the deploy workflow,
      # so deploy directly when the data changed.
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=cyprus-house-listings
