<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyprus Plot & Land Listings — Internal Reference</title>
<style>
  :root {
    --bg: #f4f5f7; --card-bg: #ffffff; --border: #e2e4e8; --text: #1c1f26;
    --muted: #6b7280; --accent: #1d4ed8; --accent-bg: #eef2ff; --tag: #374151;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background:#0f3d2e; color:#fff; padding:20px 28px; }
  header h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:#a7c4b5; font-size:13px; }
  .nav { margin-bottom:10px; font-size:13px; }
  .nav a { color:#a7f3d0; text-decoration:none; font-weight:600; margin-right:14px; }
  .nav a.current { color:#fff; text-decoration:underline; }
  .stats { display:flex; gap:18px; margin-top:12px; flex-wrap:wrap; }
  .stat { background:#14532d; padding:6px 12px; border-radius:6px; font-size:12px; color:#e5e7eb; }
  .stat b { color:#fff; font-size:14px; }

  .filters { position: sticky; top:0; z-index: 10; background:#fff; border-bottom:1px solid var(--border); padding:14px 28px; display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }
  .filter-group { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .filter-group label { font-weight:600; }
  .filter-group input, .filter-group select { padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:13px; min-width:110px; }
  .filter-group.grow { flex:1; min-width:180px; }
  .filter-group.grow input { min-width:100%; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--border); border-radius:14px; padding:5px 12px; font-size:12px; cursor:pointer; user-select:none; background:#fff; color:var(--tag); }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .reset-btn { padding:7px 14px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; color:var(--tag); }
  .reset-btn:hover { background:#f3f4f6; }

  .results-bar { padding:10px 28px; font-size:13px; color:var(--muted); }

  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap:16px; padding:6px 28px 40px; }
  /* Cards are rendered a page at a time (see renderChunk), and the ones that
     scroll out of view still cost layout and paint. content-visibility lets the
     browser skip both; the intrinsic size keeps the scrollbar honest. */
  .card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; transition: box-shadow .15s;
          content-visibility:auto; contain-intrinsic-size:0 340px; }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .card-img { width:100%; height:170px; object-fit:cover; background:#e5e7eb; display:block; }
  .card-img.placeholder { display:flex; align-items:center; justify-content:center; color:#9ca3af; font-size:12px; text-align:center; padding:10px; }
  .card-body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .card-price { font-size:17px; font-weight:700; color:#111827; }
  .card-title { font-size:13.5px; font-weight:600; color:#1f2937; line-height:1.3; }
  .card-loc { font-size:12.5px; color:var(--muted); }
  .card-meta { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:2px; }
  .card-meta span { background:#f3f4f6; padding:3px 7px; border-radius:5px; }
  .card-meta span.plot { background:#dcfce7; color:#14532d; font-weight:600; }
  .card-footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px solid #f0f1f3; }
  .source-tag { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 8px; border-radius:4px; background:#e5e7eb; color:#374151; }
  .source-Bazaraki { background:#dcfce7; color:#14532d; }
  .source-eAuction { background:#fee2e2; color:#7f1d1d; }
  .source-Kadis { background:#e0e7ff; color:#3730a3; }
  .source-Realting { background:#d1fae5; color:#065f46; }
  .source-APITS { background:#ffedd5; color:#9a3412; }
  .card-link { font-size:12.5px; color:var(--accent); text-decoration:none; font-weight:600; }
  .card-link:hover { text-decoration:underline; }
  .posted { font-size:11px; color:#9ca3af; }
  .empty-state { padding:60px 28px; text-align:center; color:var(--muted); }
  #sentinel { height:1px; }
  /* map view */
  .view-toggle { display:inline-flex; gap:0; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-left:auto; }
  .view-toggle button { border:0; background:var(--card-bg); color:var(--muted); font-size:12.5px; font-weight:600; padding:6px 14px; cursor:pointer; }
  .view-toggle button.active { background:var(--accent); color:#fff; }
  .results-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #map { display:none; height:72vh; min-height:420px; margin:0 28px 28px; border:1px solid var(--border); border-radius:12px; }
  body.map-view #map { display:block; }
  body.map-view .grid, body.map-view #sentinel { display:none; }
  .geo-note { font-size:12px; color:var(--muted); }
  .pin { background:var(--accent); color:#fff; font-size:11.5px; font-weight:700; padding:3px 7px; border-radius:11px; white-space:nowrap;
         box-shadow:0 1px 4px rgba(0,0,0,.35); border:1.5px solid #fff; }
  .leaflet-popup-content { margin:10px 12px; font-size:13px; line-height:1.45; }
  .leaflet-popup-content img { width:100%; height:110px; object-fit:cover; border-radius:6px; margin-bottom:6px; }
  .leaflet-popup-content b { font-size:14px; }
  .leaflet-popup-content a { color:var(--accent); font-weight:600; }
</style>
</head>
<body>

<header>
  <div class="nav"><a href="index.html">🏠 Houses</a><a href="plots.html" class="current">🟩 Plots &amp; Land</a><a href="faq.html">📖 Zones FAQ</a></div>
  <h1>Cyprus Plot &amp; Land Listings — Internal Reference</h1>
  <p>Residential, commercial and agricultural plots compiled across sources. Cross-source duplicates removed automatically. For internal review only — verify all details on the source site before acting.</p>
  <div class="stats" id="statsBar"></div>
</header>

<div class="filters">
  <div class="filter-group grow">
    <label>Search</label>
    <input type="text" id="searchInput" placeholder="Location, title, ref code...">
  </div>
  <div class="filter-group">
    <label>District</label>
    <select id="districtFilter"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Plot type</label>
    <select id="typeFilter"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Min price (€)</label>
    <input type="number" id="minPrice" placeholder="0">
  </div>
  <div class="filter-group">
    <label>Max price (€)</label>
    <input type="number" id="maxPrice" placeholder="No limit">
  </div>
  <div class="filter-group">
    <label>Min plot m²</label>
    <input type="number" id="minPlot" placeholder="0">
  </div>
  <div class="filter-group">
    <label>Max plot m²</label>
    <input type="number" id="maxPlot" placeholder="No limit">
  </div>
  <div class="filter-group">
    <label>Sort by</label>
    <select id="sortBy">
      <option value="plot_desc">Plot size: largest first</option>
      <option value="plot_asc">Plot size: smallest first</option>
      <option value="price_asc">Price: low to high</option>
      <option value="price_desc">Price: high to low</option>
      <option value="ppsqm_asc">Price per m²: low to high</option>
      <option value="ppsqm_desc">Price per m²: high to low</option>
      <option value="recent">Most recently posted</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Source</label>
    <div class="chips" id="sourceChips"></div>
  </div>
  <button class="reset-btn" id="resetBtn">Reset filters</button>
</div>

<div class="results-bar" id="resultsBar">
  <span id="resultsCount"></span>
  <span class="geo-note" id="geoNote"></span>
  <span class="view-toggle">
    <button id="btnGrid" class="active" type="button">Grid</button>
    <button id="btnMap" type="button">Map</button>
  </span>
</div>
<div class="grid" id="grid"></div>
<div id="sentinel"></div>
<div id="map"></div>

<!-- The dataset ships inside the page, but as JSON rather than a JS literal:
     the browser hands the whole blob to JSON.parse in one go instead of running
     it through the JavaScript parser, which is markedly faster at this size. -->
<script type="application/json" id="listingsData">__DATA__</script>
<script>
const LISTINGS = JSON.parse(document.getElementById('listingsData').textContent);

const sourceCounts = new Map();
const districtSet = new Set();
const typeSet = new Set();
for (const l of LISTINGS) {
  sourceCounts.set(l.source, (sourceCounts.get(l.source) || 0) + 1);
  if (l.district) districtSet.add(l.district);
  if (l.plotType) typeSet.add(l.plotType);
}
const sources = [...sourceCounts.keys()];
const districts = [...districtSet].sort();
const plotTypes = [...typeSet].sort();

const state = { sources: new Set(sources), district: '', plotType: '', minPrice: null, maxPrice: null, minPlot: null, maxPlot: null, sort: 'plot_desc', q: '', view: 'grid' };

function shortSource(s){ if (s === 'A Place in the Sun') return 'APITS'; if (s === 'eAuction Cyprus') return 'eAuction'; if (s === 'Kadis Estates') return 'Kadis'; return s.split(' ')[0]; }

function renderChips(){
  const el = document.getElementById('sourceChips');
  el.innerHTML = '';
  sources.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.sources.has(s) ? ' active' : '');
    chip.textContent = s + ' (' + sourceCounts.get(s) + ')';
    chip.onclick = () => {
      if (state.sources.has(s)) state.sources.delete(s); else state.sources.add(s);
      renderChips(); applyFilters();
    };
    el.appendChild(chip);
  });
}

function fillSelect(id, values){
  const sel = document.getElementById(id);
  const frag = document.createDocumentFragment();
  values.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; frag.appendChild(o); });
  sel.appendChild(frag);
}

function fmtPrice(n){ return n == null ? 'Price on request' : '€' + n.toLocaleString('en-US'); }

function postedRank(p){
  if (!p) return 999;
  const s = p.toLowerCase();
  if (s.includes('hour')) return 0;
  if (s === 'today') return 0.5;
  if (s === 'yesterday') return 1;
  const m = s.match(/(\d+)\s*day/); if (m) return parseInt(m[1]);
  const w = s.match(/(\d+)\s*week/); if (w) return parseInt(w[1])*7;
  return 500;
}
function effAge(l){ return l.postedTs ? (Date.now() - l.postedTs) / 86400000 : postedRank(l.posted); }
// Price per m² (asking price ÷ plot area); plots lacking either sort to the end.
function ppSqm(l, fallback){ return (l.price && l.plotSqm) ? l.price / l.plotSqm : fallback; }
// Format €/m² with enough precision for large cheap fields (€0.03/m²) without
// noise on normal plots (€1,250/m²).
function fmtPerSqm(v){
  const s = v >= 10 ? Math.round(v).toLocaleString('en-US') : v >= 1 ? v.toFixed(1) : v.toFixed(2);
  return `€${s}/m²`;
}

function cardHtml(l){
  const img = l.image
    ? `<img class="card-img" src="${l.image}" loading="lazy" decoding="async" width="270" height="170" onerror="this.outerHTML='<div class=\\'card-img placeholder\\'>No photo available<\\/div>'">`
    : `<div class="card-img placeholder">${l.source === 'eAuction Cyprus' ? 'No photo published<br>(auction listing)' : 'No photo available'}</div>`;
  const meta = [];
  if (l.plotSqm) meta.push(`<span class="plot">${l.plotSqm.toLocaleString('en-US')} m² plot</span>`);
  if (l.price && l.plotSqm) meta.push(`<span class="ppsqm">${fmtPerSqm(l.price / l.plotSqm)}</span>`);
  if (l.plotType) meta.push(`<span>${l.plotType}</span>`);
  if (l.zone) meta.push(`<span>Zone ${l.zone}</span>`);
  if (l.auctionDate) meta.push(`<span>Auction ${l.auctionDate}</span>`);
  const sourceClass = 'source-' + shortSource(l.source);
  const posted = l.posted ? `<span class="posted">Posted: ${l.posted}</span>` : `<span class="posted">Posted: not shown by source</span>`;
  return `<div class="card">
    ${img}
    <div class="card-body">
      <div class="card-price">${fmtPrice(l.price)}${l.priceDisplay && l.priceDisplay.includes('reserve') ? ' (reserve)' : ''}</div>
      <div class="card-title">${l.title}</div>
      <div class="card-loc">${l.location}${l.ref ? ' · Ref '+l.ref : ''}</div>
      <div class="card-meta">${meta.join('')}</div>
      ${posted}
      <div class="card-footer">
        <span class="source-tag ${sourceClass}">${l.source}</span>
        <a class="card-link" href="${l.link}" target="_blank" rel="noopener">View listing →</a>
      </div>
    </div>
  </div>`;
}


/* ── map view ──────────────────────────────────────────────────────────────
 * Only listings with real per-listing coordinates are plotted. Bazaraki
 * publishes them; most other sources do not, so the map deliberately covers a
 * subset and says so rather than inventing positions from town names — a pin
 * at a village centre looks exactly as precise as a real one, which is worse
 * than an honest gap.
 *
 * Leaflet is vendored in public/vendor/ (no CDN). Map tiles still come from
 * openstreetmap.org — that is the one unavoidable external request.
 * Both the library and its stylesheets load on first use: ~250 KB of parser
 * work charged to every visitor, most of whom never leave the grid.
 */
// Popup content is built from scraped titles and URLs, so it is escaped —
// the card renderer above predates this and interpolates raw.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));
let _map = null, _cluster = null, _leaflet = null;
const hasGeo = l => typeof l.lat === "number" && typeof l.lng === "number";

function loadAsset(tag, attrs){
  return new Promise((resolve, reject) => {
    const el = Object.assign(document.createElement(tag), attrs);
    el.onload = resolve; el.onerror = reject;
    document.head.appendChild(el);
  });
}

// markercluster extends L, so it can only load once leaflet.js has run.
function loadLeaflet(){
  if (!_leaflet) {
    _leaflet = Promise.all([
      loadAsset('link', { rel: 'stylesheet', href: 'vendor/leaflet.css' }),
      loadAsset('link', { rel: 'stylesheet', href: 'vendor/MarkerCluster.css' }),
      loadAsset('link', { rel: 'stylesheet', href: 'vendor/MarkerCluster.Default.css' }),
      loadAsset('script', { src: 'vendor/leaflet.js' })
        .then(() => loadAsset('script', { src: 'vendor/leaflet.markercluster.js' })),
    ]);
  }
  return _leaflet;
}

function ensureMap(){
  if (_map) return;
  _map = L.map("map", { scrollWheelZoom: true }).setView([34.95, 33.15], 9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(_map);
  _cluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 45, spiderfyOnMaxZoom: true });
  _map.addLayer(_cluster);
}

function pinIcon(l){
  const label = l.price != null ? "€" + Math.round(l.price / 1000) + "k" : "?";
  return L.divIcon({ className: "", html: '<div class="pin">' + label + "</div>", iconSize: null });
}

function popupHtml(l){
  const bits = [];
  if (l.beds != null) bits.push(l.beds + " bed");
  if (l.houseSqm != null) bits.push(l.houseSqm + " m²");
  if (l.plotSqm != null) bits.push("plot " + l.plotSqm + " m²");
  return [
    l.image ? '<img src="' + esc(l.image) + '" alt="" loading="lazy">' : "",
    "<b>" + (l.priceDisplay || "Price on request") + "</b><br>",
    esc(l.title || ""), "<br>",
    bits.length ? '<span style="color:#6b7280">' + bits.join(" · ") + "</span><br>" : "",
    '<span style="color:#6b7280">' + esc(l.location || l.district || "") + " · " + esc(l.source) + "</span><br>",
    '<a href="' + esc(l.link) + '" target="_blank" rel="noopener">View on ' + esc(l.source) + " ↗</a>"
  ].join("");
}

function renderMap(items){
  loadLeaflet().then(() => {
    ensureMap();
    _cluster.clearLayers();
    const geo = items.filter(hasGeo);
    _cluster.addLayers(geo.map(l => L.marker([l.lat, l.lng], { icon: pinIcon(l) }).bindPopup(popupHtml(l))));
    const note = document.getElementById("geoNote");
    if (note) {
      note.textContent = geo.length === items.length
        ? ""
        : geo.length + " of " + items.length + " shown plots have exact coordinates";
    }
    // Order matters. The container was display:none until this click, so Leaflet
    // still has it measured as 0x0 — fitting bounds against that yields zoom 0
    // and the whole dataset collapses into a single cluster over the Atlantic.
    // Re-measure first, then fit, both after layout has settled.
    setTimeout(() => {
      _map.invalidateSize();
      if (geo.length) {
        _map.fitBounds(L.latLngBounds(geo.map(l => [l.lat, l.lng])).pad(0.05));
      }
    }, 0);
  });
}

function setView(view){
  state.view = view;
  document.body.classList.toggle("map-view", view === "map");
  document.getElementById("btnGrid").classList.toggle("active", view === "grid");
  document.getElementById("btnMap").classList.toggle("active", view === "map");
  applyFilters();
}

/* ── incremental grid ──────────────────────────────────────────────────────
 * A filter that matches everything matches 8,000+ plots. Building all of those
 * cards up front produced a six-figure DOM and several seconds of blocked main
 * thread before anything appeared, for a viewport that shows about a dozen.
 * Cards are appended a chunk at a time as the sentinel below the grid comes
 * into view; the result count always reflects the full match, not what is
 * currently in the DOM.
 */
const CHUNK = 60;
const grid = document.getElementById('grid');
const sentinel = document.getElementById('sentinel');
let matches = [], rendered = 0;

function renderChunk(){
  const next = matches.slice(rendered, rendered + CHUNK);
  if (!next.length) return;
  grid.insertAdjacentHTML('beforeend', next.map(cardHtml).join(''));
  rendered += next.length;
}

// One chunk may not reach the bottom of a tall window, and IntersectionObserver
// only fires on change — so keep appending until the sentinel is pushed clear.
// The guard caps a single call at 40 chunks: a filter that matches everything
// on a very tall window should still not walk the whole dataset.
function fillViewport(){
  if (state.view === 'map') return;
  let guard = 0;
  while (rendered < matches.length && guard++ < 40 &&
         sentinel.getBoundingClientRect().top < window.innerHeight + 800) {
    renderChunk();
  }
}

new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) fillViewport();
}, { rootMargin: '800px' }).observe(sentinel);

function applyFilters(){
  const { sources: srcs, district, plotType, minPrice, maxPrice, minPlot, maxPlot } = state;
  const q = state.q ? state.q.toLowerCase() : '';
  // One pass rather than a chain of .filter() calls, each of which allocated a
  // fresh 8k-element array on every keystroke.
  const items = LISTINGS.filter(l => {
    if (!srcs.has(l.source)) return false;
    if (district && l.district !== district) return false;
    if (plotType && l.plotType !== plotType) return false;
    if (minPrice != null && l.price != null && l.price < minPrice) return false;
    if (maxPrice != null && l.price != null && l.price > maxPrice) return false;
    if (minPlot != null && !(l.plotSqm >= minPlot)) return false;
    if (maxPlot != null && !(l.plotSqm <= maxPlot)) return false;
    if (q) {
      if (l._q === undefined) l._q = ((l.title||'') + ' ' + (l.location||'') + ' ' + (l.ref||'')).toLowerCase();
      if (!l._q.includes(q)) return false;
    }
    return true;
  });

  if (state.sort === 'price_asc') items.sort((a,b) => (a.price ?? 1e15) - (b.price ?? 1e15));
  else if (state.sort === 'price_desc') items.sort((a,b) => (b.price ?? -1) - (a.price ?? -1));
  else if (state.sort === 'plot_desc') items.sort((a,b) => (b.plotSqm ?? -1) - (a.plotSqm ?? -1));
  else if (state.sort === 'plot_asc') items.sort((a,b) => (a.plotSqm ?? 1e15) - (b.plotSqm ?? 1e15));
  else if (state.sort === 'ppsqm_asc') items.sort((a,b) => ppSqm(a, 1e15) - ppSqm(b, 1e15));
  else if (state.sort === 'ppsqm_desc') items.sort((a,b) => ppSqm(b, -1) - ppSqm(a, -1));
  else if (state.sort === 'recent') items.sort((a,b) => effAge(a) - effAge(b));

  document.getElementById('resultsCount').textContent = `Showing ${items.length} of ${LISTINGS.length} plots`;
  matches = items;
  rendered = 0;
  grid.innerHTML = items.length ? '' : '<div class="empty-state" style="grid-column:1/-1">No plots match these filters. Try widening your search.</div>';
  fillViewport();
  if (state.view === 'map') renderMap(items);
}

function renderStats(){
  let withPhoto = 0, priced = 0, sum = 0;
  for (const l of LISTINGS) {
    if (l.image) withPhoto++;
    if (l.price != null) { priced++; sum += l.price; }
  }
  const avg = priced ? Math.round(sum / priced) : 0;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><b>${LISTINGS.length}</b> total plots</div>
    <div class="stat"><b>${sources.length}</b> sources</div>
    <div class="stat"><b>${withPhoto}</b> with photos</div>
    <div class="stat"><b>€${avg.toLocaleString('en-US')}</b> average asking price</div>
    <div class="stat"><b>${districts.length}</b> districts covered</div>
  `;
}

// Typing runs the whole filter-sort-render pipeline; without this every
// keystroke re-sorted 8k plots mid-word.
let _debounce;
function debounced(fn){ clearTimeout(_debounce); _debounce = setTimeout(fn, 150); }

document.getElementById('searchInput').addEventListener('input', e => { state.q = e.target.value; debounced(applyFilters); });
document.getElementById('districtFilter').addEventListener('change', e => { state.district = e.target.value; applyFilters(); });
document.getElementById('typeFilter').addEventListener('change', e => { state.plotType = e.target.value; applyFilters(); });
